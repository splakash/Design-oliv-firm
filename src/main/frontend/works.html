    <script>
        
          
        const params = new URLSearchParams(window.location.search);
        const anchorId = params.get("id");
        console.log("Received ID:", anchorId);
        
        async function fetchdetails(id){
            try{
                const response = await fetch(`http://localhost:8080/api/images/details?id=${id}`);
                if(!response.ok){
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const workdetails =await response.json();
                const para = document.getElementById("cvrdesc").textContent=workdetails.coverDescription;
                const para2 = document.getElementById("worktitle").textContent=workdetails.title;
                const para3 = document.getElementById("worklongdesc").textContent=workdetails.longDescription;
                folder_id = workdetails.folderId.replace(/\/$/, "");
                console.log(folder_id);
                displayWorkimages(folder_id);
            }
            catch(e){
                    console.error(e);
            }
        }

        async function displayWorkimages(id) {
          try {
              const response = await fetch(`http://localhost:8080/api/images/works?folderName=${id}`);
              if (!response.ok) {
                  throw new Error(`HTTP error! Status: ${response.status}`);
              }
      
              const data = await response.json();
              console.log("Fetched Data:", data);
              const imageData = data.slice(1);
              const imgContainer = document.querySelector('.imgContainer2');
              imgContainer.innerHTML = "";
      
              let currentRow = null;
              let currentPartition = null;
              let countInRow = 0;
      
              imageData.forEach(image => {
                  const partition = image.partitionType;
                  let width = "100%";
                  if (partition === "2") width = "50%";
                  if (partition === "3") width = "33.33%";
      
                  // If partition type changes or row is full, start a new row
                  if (!currentRow || currentPartition !== partition || 
                      (partition === "2" && countInRow === 2) ||
                      (partition === "3" && countInRow === 3)) {
                      currentRow = document.createElement('div');
                      currentRow.style.display = "flex";
                      currentRow.style.width = "100%";
                      currentRow.style.marginBottom = "10px";
                      imgContainer.appendChild(currentRow);
                      currentPartition = partition;
                      countInRow = 0;
                  }
      
                  const imgElement = document.createElement('img');
                  imgElement.src = image.url;
                  imgElement.alt = "Image";
                  imgElement.style.width = width;
                  imgElement.style.objectFit="cover";
                  imgElement.style.padding = "5px";
                  imgElement.style.boxSizing = "border-box";
      
                  currentRow.appendChild(imgElement);
                  countInRow++;
              });
      
          } catch (error) {
              console.error("Error fetching details:", error);
          }
      }
      
      

        fetchdetails(anchorId)

    </script>
