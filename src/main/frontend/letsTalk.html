<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let's Talk Branding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="style.css" rel="stylesheet">
  <!-- Import Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            purple: {
              light: '#D6BCFA',
              DEFAULT: '#9b87f5',
              dark: '#7E69AB',
              deep: '#1A1F2C',
              soft: '#E5DEFF'
            },
            gray: {
              soft: '#F1F0FB'
            }
          },
          fontFamily: {
            'serif': ['Playfair Display', 'serif'],
            'sans': ['Inter', 'sans-serif']
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'fade-in': 'fadeIn 0.7s ease-out',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    .decorator {
      @apply absolute bg-purple-soft opacity-50 rounded-full z-0;
    }
    
    .floating-label {
      @apply absolute left-4 top-3 text-gray-400 transition-all duration-300 pointer-events-none;
    }
    
    .input-field:focus + .floating-label,
    .input-field:not(:placeholder-shown) + .floating-label {
      @apply -top-6 left-0 text-sm text-purple-dark;
    }
  </style>
</head>
<body>
  <div id="header-container"></div>
<div class="min-h-screen bg-gradient-to-br from-white to-gray-soft flex items-center justify-center relative overflow-hidden px-4 py-10 md:py-0 font-sans">
    
  <!-- Decorative elements -->
  <div class=" decorator w-64 h-64 top-[-5%] right-[-5%] animate-float"></div>
  <div class="decorator w-48 h-48 bottom-[-5%] left-[10%] animate-float" style="animation-delay: 2s"></div>
  <div class="decorator w-32 h-32 top-[20%] left-[5%] animate-float" style="animation-delay: 1s"></div>
  
  <div class="container pr-[196px] max-w-6xl mx-auto z-10">
    <div class="bg-white bg-opacity-80 backdrop-blur-lg rounded-2xl shadow-xl overflow-hidden">
      <div class="flex flex-col md:flex-row">
        <!-- Content section -->
        <div class="w-full md:w-2/5 p-8 md:p-12 bg-gradient-to-br from-purple-deep to-purple-dark text-white flex flex-col justify-center relative overflow-hidden">
          <div class="absolute w-64 h-64 bg-purple opacity-10 rounded-full -top-24 -left-24"></div>
          <div class="absolute w-64 h-64 bg-purple opacity-10 rounded-full -bottom-24 -right-24"></div>
          
          <div class="relative z-10 animate-fade-in">
            <h4 class="text-purple-light uppercase tracking-widest text-sm mb-3">Get in touch</h4>
            <h2 class="font-serif text-4xl md:text-5xl font-bold mb-6">Let's Talk Branding</h2>
            <p class="text-lg opacity-90 mb-8 leading-relaxed">
              From strategy to execution, we're here to help you achieve your branding goals and create an unforgettable identity.
            </p>
            <div class="flex items-center space-x-4">
              <div class="w-12 h-1 bg-purple-light"></div>
              <p class="text-sm opacity-80">Let's create something amazing together</p>
            </div>
          </div>
        </div>
        
        <!-- Form section -->
        <div class="bg-[#F1F6F5] w-full md:w-3/5 p-8 md:p-12 animate-fade-in" style="animation-delay: 0.2s">
          <form class="space-y-8">
            <div class="relative mb-6">
              <input 
                type="text" 
                id="name" 
                class="w-full px-4 py-3 bg-white border border-purple-soft focus:border-purple rounded-md transition-all duration-300 outline-none focus:ring-2 focus:ring-purple-soft input-field" 
                placeholder=" "
                required 
              />
              <label for="name" class="floating-label">NAME</label>
            </div>
            
            <div class="relative mb-6">
              <input 
                type="email" 
                id="email" 
                class="w-full px-4 py-3 bg-white border border-purple-soft focus:border-purple rounded-md transition-all duration-300 outline-none focus:ring-2 focus:ring-purple-soft input-field" 
                placeholder=" "
                required 
              />
              <label for="email" class="floating-label">EMAIL ADDRESS</label>
            </div>
            
            <div class="relative mb-6">
              <textarea 
                id="message" 
                class="w-full px-4 py-3 bg-white border border-purple-soft focus:border-purple rounded-md transition-all duration-300 outline-none focus:ring-2 focus:ring-purple-soft min-h-[120px] resize-none input-field" 
                placeholder=" "
                required
              ></textarea>
              <label for="message" class="floating-label">MESSAGE</label>
            </div>
            
            <div class="flex justify-start">
              <button 
                type="submit" 
                class="bg-gradient-to-r from-purple to-purple-dark text-white py-3 px-8 rounded-md hover:shadow-lg transition-all duration-300 hover:translate-y-[-2px] focus:outline-none focus:ring-2 focus:ring-purple-light flex items-center group"
              >
                Send message
                <svg xmlns="http://www.w3.org/2000/svg" class="ml-2 h-4 w-4 transition-transform group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  
  <script>
    document.querySelector('form').addEventListener('submit', function(e) {
      e.preventDefault();
      // Simulate form submission
      const submitButton = this.querySelector('button[type="submit"]');
      const originalText = submitButton.innerHTML;
      submitButton.innerHTML = 'Sending...';
      submitButton.disabled = true;
      
      setTimeout(() => {
        alert('Message sent! We\'ll get back to you shortly.');
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('message').value = '';
        submitButton.innerHTML = originalText;
        submitButton.disabled = false;
      }, 1500);
    });
  </script>
  
</div>
<div id="contact-container"></div>

<div id="footer-container"></div>
<script src="script2.js"></script>
</body>
</html>
