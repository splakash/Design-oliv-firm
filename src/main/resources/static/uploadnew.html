<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <div class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-5xl flex">
      <!-- Left Side Heading -->
      <div class="w-1/3 flex items-center justify-center">
        <h1 class="text-4xl font-bold">CMS for Uploading New Work</h1>
      </div>
      <!-- Right Side Form -->
      <div class="w-2/3 p-8 bg-white dark:bg-gray-800 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-6">Upload Cover Image</h2>
        <form id="uploadForm" enctype="multipart/form-data">
          <!-- Cover Image Input -->
          <label class="block mb-4">
            <span class="text-gray-700 dark:text-gray-300">Cover Image</span>
            <input type="file" name="file" accept="image/*" class="mt-2 block w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-700" />
          </label>

          <!-- Title Input -->
          <label class="block mb-4">
            <span class="text-gray-700 dark:text-gray-300">Title</span>
            <input type="text" name="title" class="mt-2 block w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-700" />
          </label>

          <!-- Cover Image Description -->
          <label class="block mb-4">
            <span class="text-gray-700 dark:text-gray-300">Cover Image Description</span>
            <input type="text" name="coverDescription" class="mt-2 block w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-700" />
          </label>

         <!-- Long Description -->
         <label class="block mb-4">
            <span class="text-gray-700 dark:text-gray-300">Long Description</span>
            <textarea name="longDescription" rows="4" class="mt-2 block w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-700"></textarea>
          </label>

          <!-- Folder ID -->
          <label class="block mb-6">
            <span class="text-gray-700 dark:text-gray-300">Folder ID</span>
            <input type="text" name="folderId" class="mt-2 block w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-700" />
          </label>

          <!-- Submit Button -->
          <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const formData = new FormData(this);

      try {
        const response = await fetch('http://localhost:8080/api/images/upload', {
          method: 'POST',
          body: formData
        });

        const responseText = await response.text();
        if (response.ok) {
          alert('Form submitted successfully: ' + responseText);
        } else {
          alert('Failed to submit form. Server response: ' + responseText);
        }
      } catch (error) {
        console.error('Error submitting form:', error);
        alert('Error submitting form: ' + error.message);
      }
    });
  </script>
</body>
</html>
